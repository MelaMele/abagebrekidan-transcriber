name: Abba Gebrekidan Audio Transcriber to Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  transcribe-job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Libraries
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 openai-whisper ffmpeg-python

    - name: Run Scraper & Send to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python scraper_transcriber.py
